<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — CARNIX</title>
  <link rel="stylesheet" href="assets/css/variables.css" />
  <link rel="stylesheet" href="assets/css/auth.css" />
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo">C</div>
        <h1 class="auth-title">CARNIX</h1>
        <p class="auth-subtitle">Creation Lab Management</p>
      </div>

      <form id="login-form" class="auth-form">
        <label class="field">
          <span>Email</span>
          <input type="email" id="email" required placeholder="name@domain.com" autocomplete="email" />
        </label>

        <label class="field">
          <span>Password</span>
          <input type="password" id="password" required placeholder="••••••••" autocomplete="current-password" />
        </label>

        <button type="submit" class="btn-primary auth-btn" id="login-btn">Sign in</button>
        <p id="auth-msg" class="auth-msg"></p>
      </form>
    </div>
  </div>

  <script type="module" src="assets/js/auth.js"></script>
</body>
</html>
